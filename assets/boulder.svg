      <path d="m215 244 38-9 29-6 29-9 48-38"/>
      <path d="m419 312-24 27-14 28-41 40-58 14"/>
      <path d="m134 406 23-22 10-20"/>
      <path d="m388 177 18 30 9 23"/>
