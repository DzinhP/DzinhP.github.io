  <path d="m361 491-6 4 12 3 6-4" stroke="#A8AB8F" stroke-width="1.2" stroke-linecap="round"/>

  <g stroke="#78866C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m81 481-7-27m7 27 8-20m-7 12-11-12"/>
    <path d="m110 495-3-18m3 18 9-10"/>
    <path d="m519 491 7-32m-6 24-7-18m11 9 12-8"/>
    <path d="m283 517-4-17m4 17 8-9"/>
