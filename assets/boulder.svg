    <path d="m216 359 11-2 10 5-3 7-14 3-8-5Z"/>
    <path d="m243 302 9-5 6 6-3 10-13 3-4-6Z"/>
    <path d="m295 255 12-1 7 5-5 7-15 1-5-5Z"/>
    <path d="m325 193 12-2 8 6-6 7-17-1-3-5Z"/>
  </g>
  <g stroke="#E5AB8D" stroke-width="2" stroke-linecap="round">
