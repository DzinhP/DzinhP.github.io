    <g stroke="#888574" stroke-width="1" stroke-linecap="round" opacity=".42">
      <path d="M235 180c25-13 42-20 69-11 20 7 32 8 50 1"/>
      <path d="M232 192c24-13 45-15 68-9 12 3 22 4 33 1"/>
      <path d="M294 301c27-8 52-3 75-14 23-12 36-32 58-39"/>
