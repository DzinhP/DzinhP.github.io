    <path d="M490 193c38-16 77-19 119-7"/>
    <path d="M502 214c42-14 74-12 104-4"/>
    <path d="M-9 477c31-18 61-26 93-23"/>
    <path d="M-5 501c44-28 76-30 117-26"/>
    <path d="M-5 524c42-29 91-33 139-22"/>
  </g>

  <!-- Soft, broken ground keeps the stone from floating. -->
  <path d="M69 492c45-18 102-17 155-9 67 9 114-8 176-5 54 3 100 7 145 25-42 18-129 27-227 25-101-2-198-11-249-36Z" fill="#ABB79F" opacity=".5"/>
