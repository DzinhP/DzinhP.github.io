      <ellipse cx="423" cy="349" rx="1.2" ry="2"/>
      <ellipse cx="351" cy="351" rx="1.9" ry="1.1"/>
      <ellipse cx="312" cy="374" rx="1.4" ry="1.2"/>
      <ellipse cx="170" cy="232" rx="1.4" ry="1.2"/>
      <ellipse cx="252" cy="396" rx="1.1" ry="2"/>
      <ellipse cx="270" cy="291" rx="1.3" ry="1"/>
    </g>
  </g>

  <!-- A quiet line of coral holds makes the intended climb immediately legible. -->
  <path d="M175 425c18-24 32-35 53-58 12-14 9-41 23-58 16-20 43-24 56-47 14-24 11-44 27-62" stroke="#F5EEDD" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 9" opacity=".8"/>
