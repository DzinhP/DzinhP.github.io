<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" fill="none">
  <title>A boulder with a marked climbing line and a crash pad</title>
  <defs>
    <clipPath id="rock">
      <path d="M105 280 145 192Q150 181 163 175L252 132Q267 125 281 130L388 155Q400 158 409 169L465 242Q474 253 476 269L494 416Q495 432 480 442L428 479Q416 487 399 488L228 499Q214 500 200 493L128 458Q113 451 110 436L89 355Q85 340 91 326Z"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <path fill="#DFE6D7" d="M0 0h600v620H0z"/>

  <!-- The distant contours echo the grain of a climbing guidebook. -->
  <g stroke="#A7B49F" stroke-opacity=".38" stroke-width="1.1" stroke-linecap="round">
    <path d="M-25 207c66-65 107-83 151-83 57 1 53-46 114-52 67-7 82 20 141 17 75-4 116-48 225-13"/>
    <path d="M-25 231c69-65 111-89 157-88 61 2 61-45 111-49 72-6 87 21 144 18 83-4 128-45 221-13"/>
    <path d="M-24 256c69-69 125-96 166-94 59 3 63-43 107-43"/>
