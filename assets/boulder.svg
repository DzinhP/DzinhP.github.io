    <path d="m215 244 96-24 77-65 78 89-53 76-73 87-105 24-50-83Z" fill="#CFC6B2"/>
    <path d="m466 244 28 178-65 60-89-75 73-87Z" fill="#A6A18D"/>
    <path d="m185 348 50 83 105-24 89 75-204 18-116-63Z" fill="#B6AC98"/>
