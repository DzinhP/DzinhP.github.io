<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f5f4ed">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Page not found — Dzinh Pham</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: #f5f4ed;
        color: #1f2825;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header, footer { padding: 28px clamp(24px, 6vw, 88px); }
      header a { font-size: 15px; font-weight: 700; letter-spacing: -.02em; text-decoration: none; }
      a { color: inherit; text-underline-offset: 5px; }
      a:hover { opacity: .65; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
      main { align-self: center; padding: 48px 24px 72px; text-align: center; }
      .number { margin: 0 0 20px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(110px, 24vw, 240px); font-weight: 400; font-style: italic; letter-spacing: -.08em; line-height: .9; }
      h1 { margin: 0 0 16px; font-size: clamp(24px, 4vw, 36px); font-weight: 500; letter-spacing: -.04em; }
      .message { max-width: 340px; margin: 0 auto; font-size: 16px; line-height: 1.6; }
      nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 24px; margin-top: 36px; font-size: 14px; }
      footer { font-size: 12px; text-align: center; }
      @media (max-width: 420px) { header, footer { padding: 24px; } }
    </style>
  </head>
  <body>
    <header><a href="/">Dzinh Pham</a></header>
    <main>
      <p class="number" aria-hidden="true">404</p>
      <h1>A little off route.</h1>
      <p class="message">This page isn't here. Head back to basecamp to find your way.</p>
      <nav aria-label="Find your way back">
        <a href="/">Back to basecamp <span aria-hidden="true">↗</span></a>
        <a href="/#work">Explore my work <span aria-hidden="true">↗</span></a>
      </nav>
    </main>
    <footer>Dzinh Pham · A little curiosity goes a long way.</footer>
  </body>
</html>
